name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one halfway
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The KupCAD release the reference describes: its examples are checked against it
  KUPCAD_VERSION: 0.1.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.JS
        uses: actions/setup-node@v7
        with:
          check-latest: true
          cache: 'npm'
          node-version-file: '.tool-versions'

      - name: Install Javascript dependencies
        run: npm ci

      - name: Install KupCAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="kupcad_${KUPCAD_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          gh release download "v${KUPCAD_VERSION}" --repo kupcad/kupcad --pattern "$archive" --pattern checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum --check
          mkdir kupcad && tar xzf "$archive" -C kupcad
          echo "KUPCAD=$RUNNER_TEMP/kupcad/kupcad" >> "$GITHUB_ENV"

      - name: Check examples
        run: npm run check:examples

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build website
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/'

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
