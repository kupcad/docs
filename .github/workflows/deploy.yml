name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one halfway
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The KupCAD release the reference describes: its examples are checked against it, and drawn
  # by it (scripts/render-examples.mjs)
  KUPCAD_VERSION: 0.1.8

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: '.tool-versions'
          cache: true

      - name: Install Javascript dependencies
        run: pnpm install --frozen-lockfile

      # oxlint, and oxfmt's format
      - name: Lint and check formatting
        run: pnpm check

      - name: Install KupCAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="kupcad_${KUPCAD_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          gh release download "v${KUPCAD_VERSION}" --repo kupcad/kupcad --pattern "$archive" --pattern checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum --check
          mkdir kupcad && tar xzf "$archive" -C kupcad
          echo "KUPCAD=$RUNNER_TEMP/kupcad/kupcad" >> "$GITHUB_ENV"

      # Every example is linted, run, and its printed values compared with its comments
      - name: Check examples
        run: pnpm check:examples

      # Each example's picture, drawn by the viewer in headless Chromium
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Draw examples
        run: pnpm render:examples

      - name: Build website
        run: pnpm build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/'

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
